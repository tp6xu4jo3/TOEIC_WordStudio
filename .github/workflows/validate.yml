name: Verify vocabulary and quizzes
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run dictionary and question checks
        run: node --test tests/quiz.test.cjs
